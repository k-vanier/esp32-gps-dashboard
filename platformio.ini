; ESP32 GPS Dashboard
; Les GPIO 20-23 utilisés pour l'OLED et le TFT correspondent à un ESP32-C6.
; Le support Arduino du C6 passe par la plateforme communautaire pioarduino.

[platformio]
; Les paquets ESP32 dépassent la limite de 260 caractères des chemins Windows
; depuis C:\Users\<nom>\.platformio : on raccourcit le dossier de PlatformIO.
core_dir = C:/pio

[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit SSD1306@^2.5.10
    mikalhart/TinyGPSPlus@^1.0.3
